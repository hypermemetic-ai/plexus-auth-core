[package]
name = "plexus-auth-core"
version = "0.3.1"
edition = "2021"
description = "Sealed-type primitives for the Plexus auth framework: AuthContext, VerifiedUser, Principal."
license = "MIT"
repository = "https://github.com/hypermemetic-ai/plexus-auth-core"
# DIST-2: the published crate is the library and its licence.
include = ["src/**", "LICENSE", "CHANGELOG.md", "Cargo.toml"]

# Why this is its own crate:
#
# Module-private constructors within `plexus-core` are a procedural defense —
# they rely on contributors respecting visibility within a single crate. A future
# PR to plexus-core that adds a `pub fn forge_auth_context()` would compile.
# Review would catch it; the type system would not.
#
# `plexus-auth-core` exists so the auth primitives have a home that no other
# crate can bypass. Combined with Rust's orphan rules and crate-private
# constructors, this escalates the seal from procedural to structural:
#
#   - No fabrication: no public constructor reachable from other crates
#   - No backdoor From / Into: orphan rules forbid third crates from adding any
#   - No accidental Default: explicitly NOT derived
#   - No leaky Deserialize: routed through the verifier or absent
#   - No mutation: fields private to plexus-auth-core
#
# See AUTHZ-0 §"Crate-level isolation amplifies the seal" and the ticket
# AUTHZ-CORE-CRATE-1 for the full rationale.

[lib]
name = "plexus_auth_core"
path = "src/lib.rs"

[features]
# `test-support` exposes a small set of pub-but-doc-hidden constructors so
# downstream crates (notably plexus-core) can write end-to-end tests that
# need to mint real sealed values. These constructors are gated and
# `#[doc(hidden)]`; they MUST NOT be reachable from production builds.
# Enable via `[dev-dependencies] plexus-auth-core = { features =
# ["test-support"] }` — never as a default feature and never in
# `[dependencies]`.
#
# Added by AUTHZ-CRED-CORE-1B so plexus-core can exercise the end-to-end
# `Credential<T>` serialization path now that
# `run_with_credential_capture` is publicly reachable.
test-support = []

# `oidc-reqwest` enables the batteries-included HTTP fetcher
# (`oidc::ReqwestJwksFetcher`) behind the `oidc` module's `JwksFetcher`
# trait. Off by default so the sealed-types crate stays lean for consumers
# that don't run the validator (the trait itself is always compiled;
# backends with their own HTTP stack inject a fetcher instead). Added by
# UT-1 per UT-S01 D1.
oidc-reqwest = ["dep:reqwest"]

# IDENTITY-13: provider adapters (`src/adapters.rs`): the OIDC adapter's
# profiles (plexus-idp, Auth0, generic) with the reqwest fetcher, and the
# nostr NIP-98 adapter. Off by default; a service that admits callers
# through adapters turns it on.
adapters = ["oidc-reqwest", "dep:nostr", "dep:base64", "dep:sha2", "dep:ed25519-dalek"]

[dependencies]
# Serialization. Note: Deserialize is intentionally implemented in a way that
# documents the seal rather than offering a back-door. See module docs.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Schema generation, for IR/codegen integration. `chrono04` so the
# `CredentialMetadata::expires_at` field's `DateTime<Utc>` participates in
# `JsonSchema` derivation.
schemars = { version = "1.1", features = ["derive", "chrono04"] }

# Async-trait so the SessionValidator-shaped traits can live here in the future.
async-trait = "0.1"

# Issuer URLs in OIDC AuthMechanism::Oidc. AUTHZ-S01-output §1 pins
# `IssuerUrl(url::Url)` for the capability-advertisement type set landed in
# AUTHZ-CORE-3.
url = { version = "2", features = ["serde"] }

# Timestamps on credential metadata (expires_at). AUTHZ-CRED-S01-output §2 pins
# `Option<DateTime<Utc>>`; the workspace's canonical timestamp type is
# chrono::DateTime<Utc> (see plexus-core/Cargo.toml). Used by
# `CredentialMetadata::expires_at` in `src/credential.rs`.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# AUTHZ-PRIVACY-1: `AuditRecord::correlation_id` is a UUID (per
# AUTHZ-S01-output §8). Workspace canonical version is 1.x; we pull `v4` for
# generation and `serde` for round-trip.
uuid = { version = "1.6", features = ["v4", "serde"] }

# AUTHZ-PRIVACY-1: `TracingAuditSink` emits structured `tracing::info!` events
# under `target = "plexus::audit"` so every backend gets observability for
# free (AUTHZ-S01-output §8). Workspace pins `tracing = "0.1"`.
tracing = "0.1"

# UT-1 / UT-S01 D1: the OIDC validator (`src/oidc/`). `jsonwebtoken` is the
# workspace's jose crate (plexus-trak already pins "9"); it covers RS256
# signature validation, JWKS (RFC 7517) parsing via `jsonwebtoken::jwk`,
# and `iss`/`aud`/`exp` claim checks. AUTH-2's spike contract names it as
# the first-choice library.
#
# PLEXUS-45: natively it stays 9 (ring), as it was — see the target tables
# below for wasm32, where ring needs clang and 10's RustCrypto backend
# does not.

# Default discovery/JWKS HTTP fetcher, gated behind the `oidc-reqwest`
# feature (see [features]). reqwest 0.12 is the workspace's usual HTTP
# client (hyperforge, plexus-substrate, ...); rustls avoids a native TLS
# linkage in this foundational crate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# IDENTITY-13 (`adapters`): rust-nostr decodes and verifies NIP-98 events;
# base64 reads them, and a JWT's unverified `iss` for routing.
nostr = { version = "0.45", default-features = false, features = ["std"], optional = true }
base64 = { version = "0.22", optional = true }
# IDENTITY-27: a NIP-98 `payload` tag is the SHA-256 of the request body.
sha2 = { version = "0.10", optional = true }
# IDENTITY-41: an agent's Ed25519 key proof (`KeyProofAdapter`).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"], optional = true }

# IDENTITY-27: the validator's JWKS refresh is single-flight — concurrent
# callers wait on one async lock instead of each fetching.
tokio = { version = "1", default-features = false, features = ["sync"] }

# PLEXUS-45: the crate builds for wasm32-unknown-unknown (a browser crate
# depends on it through plexus-rpc and plexus-core) with every native
# dependency unchanged. Native keeps jsonwebtoken 9 on ring, exactly as
# before; wasm32 takes jsonwebtoken 10 on RustCrypto (pure Rust; ring will
# not build there without clang) — `src/oidc/` reads the same API from
# both. Moving native to 10 (aws-lc-rs, a C build in every native consumer)
# is its own decision, not this one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = "9"

# wasm32 only: randomness and the clock from the JS runtime (uuid's v4,
# chrono's `Utc::now`, which otherwise compile and panic at the first call).
# getrandom 0.3's `wasm_js` also needs `--cfg getrandom_backend="wasm_js"`
# (this machine's ~/.cargo/config.toml sets it for the target).
[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1.6", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[dev-dependencies]
# trybuild drives compile-fail assertions: AuthContext / VerifiedUser /
# Principal cannot be constructed from outside this crate.
trybuild = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }

# AUTHZ-PRIVACY-1: assert `TracingAuditSink` emits to the `plexus::audit`
# target. `tracing-test` captures span/event output for in-test assertions.
# `no-env-filter` is required because our events use `target = "plexus::audit"`
# (a logical target), not the crate-derived target tracing-test filters on
# by default.
tracing-test = { version = "0.2", features = ["no-env-filter"] }

# IDENTITY-13: the adapter tests sign NIP-98 events as a client would.
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng"] }

[[test]]
name = "adapters"
required-features = ["adapters"]

# PERF-6 (PLEXUS/PERF-6): the one build perf runs and releases use, PERF-1's
# `profiles` fork built to its recommendation. Release, with LTO across every
# crate and one codegen unit, and line tables kept for flamegraphs; `panic` is
# release's (menger's tests rely on unwinding). Dev, test and release are
# unchanged. `cargo build --profile perf`; plexus-bench measures with it.
[profile.perf]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
